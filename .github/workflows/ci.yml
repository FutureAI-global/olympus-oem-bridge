name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mcp-build:
    name: MCP TypeScript build + smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Type-check
        run: npx tsc --noEmit
      - name: Run jest tests
        run: npm test
      - name: Build dist/
        run: npm run build
      - name: Smoke — launcher fails fast when bundle is missing
        run: |
          # FDRS bundle is not running in CI. The launcher should exit
          # with code 2 and print the expected error — proving the binary
          # loads, the MCP framing initializes, and the health probe runs.
          set +e
          FDRS_LAYER2_TIMEOUT_MS=1500 \
            timeout 5 node dist/bin/olympus-fdrs-layer2-mcp.js < /dev/null > out.log 2>&1
          EXIT=$?
          set -e
          echo "exit=$EXIT"
          cat out.log
          if [ "$EXIT" != "2" ]; then
            echo "expected exit 2 (health probe fail), got $EXIT"
            exit 1
          fi
          if ! grep -q "bundle health probe failed" out.log; then
            echo "expected 'bundle health probe failed' in stderr, got:"
            cat out.log
            exit 1
          fi
          echo "OK — launcher fails fast as designed"

  bridge-shellcheck:
    name: Bridge build scripts shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck
      - name: Lint
        run: |
          # -S warning: only fail on warning-level + errors. Info-level
          # findings (SC2012 ls-vs-find, SC1091 source-not-followed) are
          # surfaced for review but don't block CI — common in scripts
          # that target a fixed install layout where ls is correct.
          for f in bridges/*/scripts/*.sh; do
            echo "=== $f ==="
            shellcheck -x -S warning "$f" || exit 1
          done

  link-check:
    name: Doc link integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify internal cross-references
        run: |
          # All ./ relative links in docs/ + READMEs must resolve to existing paths.
          # Prevents broken-link rot as the repo evolves.
          set -e
          fails=0
          for md in $(find . -name '*.md' -not -path './node_modules/*'); do
            dir=$(dirname "$md")
            for link in $(grep -oE '\]\((\./|\.\./|/)[^)]+' "$md" | sed 's/^](//' | sed 's/#.*//' | sort -u); do
              # Strip leading slash from absolute repo-relative links
              if [[ "$link" == /* ]]; then
                target=".$link"
              else
                target="$dir/$link"
              fi
              if [ ! -e "$target" ]; then
                echo "BROKEN: $md references missing $target (raw: $link)"
                fails=$((fails+1))
              fi
            done
          done
          if [ $fails -gt 0 ]; then
            echo "$fails broken link(s) found"
            exit 1
          fi
          echo "all links resolve"
